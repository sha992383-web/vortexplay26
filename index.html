<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEXPLAY 🎮</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:tahoma, sans-serif;}
        :root {
            --نارنجی: #FF6B00;
            --آبی: #0099FF;
            --تیره: #0f0f23;
            --کارت: #16213e;
        }
        body {
            background: linear-gradient(135deg, #0f0f23, #1a1a2e);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .کانتینر {max-width: 480px; margin: 0 auto;}
        .سرتیتر {text-align: center; padding: 25px 0;}
        h1 {
            font-size: 28px;
            background: linear-gradient(90deg, var(--نارنجی), var(--آبی));
            -webkit-background-clip: text;
            color: transparent;
        }
        .زیرنویس {color: #aaa; margin-top: 8px; font-size: 14px;}
        .باکس {
            background: var(--کارت);
            border-radius: 16px;
            padding: 25px;
            margin-top: 15px;
            border: 1px solid #2a2a4a;
        }
        textarea, input {
            width: 100%;
            background: #0f0f23;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 14px;
            color: white;
            font-size: 16px;
            margin-top: 10px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .دکمه‌اصلی {
            background: linear-gradient(90deg, var(--نارنجی), #FF8C00);
            color: white;
        }
        .دکمه‌ثانویه {
            background: transparent;
            border: 1px solid var(--نارنجی);
            color: var(--نارنجی);
        }
        .پیام {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 12px;
            margin-top: 12px;
            border-right: 3px solid var(--نارنجی);
        }
        .زمان {color: #666; font-size: 12px; margin-top: 6px;}
        h3 {color: var(--نارنجی); margin: 10px 0;}
        .خالی {text-align: center; color: #888; padding: 20px;}
    </style>
</head>
<body>
    <div class="کانتینر">
        <div class="سرتیتر">
            <h1>🎮 VORTEXPLAY</h1>
            <p class="زیرنویس">vortexplay26 — گیت‌هاب + کلادفلر ✅</p>
        </div>

        <div class="باکس">
            <h3>✉️ ارسال پیام و لینک</h3>
            <textarea id="ورودی" rows="3" placeholder="متن یا لینک دانلود را بنویس..."></textarea>
            <button class="دکمه‌اصلی" onclick="ارسال()">📤 ارسال</button>
        </div>

        <div class="باکس">
            <h3>📋 پیام‌ها</h3>
            <div id="لیست">
                <p class="خالی">هنوز پیامی نیست 😊</p>
            </div>
        </div>

        <div class="باکس">
            <h3>🔐 مدیریت</h3>
            <input type="password" id="رمز" placeholder="رمز را وارد کن">
            <button class="دکمه‌ثانویه" onclick="ورود()">ورود</button>
            <div id="پنل" style="display:none; margin-top:10px;">
                <button class="دکمه‌ثانویه" onclick="پاک_همه()">حذف همه</button>
            </div>
        </div>
    </div>

<script>
const رمز_مدیریت = "123456";
let پیامها = JSON.parse(localStorage.getItem("vp26") || "[]");

function نمایش() {
    const لیست = document.getElementById("لیست");
    if (!پیامها.length) {
        لیست.innerHTML = '<p class="خالی">هنوز پیامی نیست 😊</p>';
        return;
    }
    لیست.innerHTML = پیامها.map(p => `
        <div class="پیام">
            <div>${p.متن}</div>
            <div class="زمان">🕐 ${new Date(p.زمان).toLocaleString("fa-IR")}</div>
        </div>
    `).join("");
}

function ذخیره() {
    localStorage.setItem("vp26", JSON.stringify(پیامها));
}

function ارسال() {
    const متن = document.getElementById("ورودی").value.trim();
    if (!متن) return;
    پیامها.unshift({ متن, زمان: Date.now() });
    ذخیره();
    نمایش();
    document.getElementById("ورودی").value = "";
}

function ورود() {
    if (document.getElementById("رمز").value === رمز_مدیریت) {
        document.getElementById("پنل").style.display = "block";
    }
}

function پاک_همه() {
    if (confirm("مطمئنی؟")) {
        پیامها = [];
        ذخیره();
        نمایش();
    }
}

نمایش();
</script>
</body>
</html>
