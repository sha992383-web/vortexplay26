<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEXPLAY 🎮</title>
    <style>
        :root {
            --نئون‌آبی: #00f0ff;
            --نئون‌صورتی: #ff2d95;
            --تیره: #050510;
            --کارت: rgba(17,17,37,0.7);
        }
        * {margin:0; padding:0; box-sizing:border-box; font-family:tahoma, sans-serif;}
        body {
            background: var(--تیره);
            color: #e0e0ff;
            min-height: 100vh;
            padding: 20px;
        }
        .کانتینر {max-width: 500px; margin: 0 auto;}
        .سرتیتر {text-align: center; padding: 25px 0;}
        h1 {
            font-size: 28px;
            background: linear-gradient(90deg, var(--نئون‌آبی), var(--نئون‌صورتی));
            -webkit-background-clip: text;
            color: transparent;
        }
        .باکس {
            background: var(--کارت);
            border: 1px solid rgba(0,240,255,0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
        }
        h3 {color: var(--نئون‌آبی); margin-bottom: 12px; font-size: 15px;}
        input, textarea, select {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(0,240,255,0.3);
            padding: 12px;
            color: white;
            margin-top: 8px;
            border-radius: 8px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }
        .دکمه‌اصلی {
            background: linear-gradient(90deg, var(--نئون‌آبی), #0099ff);
            color: #000;
        }
        .دکمه‌فرعی {
            background: transparent;
            border: 1px solid var(--نئون‌صورتی);
            color: var(--نئون‌صورتی);
        }
        .پیش‌نمایش_عکس {
            max-width: 100%;
            max-height: 200px;
            margin-top: 10px;
            border-radius: 8px;
            display: none;
        }
        .آیتم {
            background: rgba(0,0,0,0.4);
            border-right: 3px solid var(--نئون‌صورتی);
            padding: 15px;
            margin-top: 12px;
            border-radius: 6px;
        }
        .آیتم_عکس {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 10px;
        }
        .آیتم_دسته {
            display: inline-block;
            font-size: 11px;
            background: rgba(255,45,149,0.2);
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 6px;
        }
        .آیتم_زمان {font-size: 11px; color: #555; margin-top: 8px;}
        .خالی {text-align: center; color: #555; padding: 30px;}
        .وضعیت {margin-top: 10px; font-size: 13px;}
        .موفق {color: #00ff9d;}
        .خطا {color: #ff4466;}
        .پنهان {display: none !important;}
        .دسته‌ها {display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px;}
        .دسته {
            padding: 8px 14px;
            border: 1px solid rgba(255,45,149,0.4);
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            color: var(--نئون‌صورتی);
        }
        .دسته.فعال {
            background: rgba(255,45,149,0.15);
            border-color: var(--نئون‌صورتی);
        }
    </style>
</head>
<body>
    <div class="کانتینر">
        <div class="سرتیتر">
            <h1>🎮 VORTEXPLAY</h1>
            <p style="color:#666; margin-top:8px;">آپلود از گالری + پنل مدیریت</p>
        </div>

        <!-- 🔐 ورود به مدیریت -->
        <div class="باکس" id="بخش_ورود">
            <h3>🔐 پنل مدیریت</h3>
            <input type="password" id="رمز_مدیریت" placeholder="رمز ۳۲ رقمی را وارد کن">
            <button class="دکمه‌فرعی" onclick="بررسی_رمز()">ورود</button>
            <p id="وضعیت_ورود" class="وضعیت"></p>
        </div>

        <!-- ✍️ ارسال پیام و عکس (فقط مدیر) -->
        <div class="باکس پنهان" id="بخش_ارسال">
            <h3>✍️ ارسال مطلب جدید</h3>
            <select id="انتخاب_دسته">
                <option value="بازی">بازی</option>
                <option value="نرم‌افزار">نرم‌افزار</option>
                <option value="آموزش">آموزش</option>
                <option value="متفرقه">متفرقه</option>
            </select>
            <textarea id="متن_پیام" rows="3" placeholder="متن توضیحات یا لینک دانلود..."></textarea>
            
            <label style="margin-top:12px; display:block; color:#aaa;">📸 انتخاب عکس از گالری:</label>
            <input type="file" id="عکس_ورودی" accept="image/*" onchange="پیش_نمایش_عکس(this)">
            <img id="پیش_نمایش" class="پیش‌نمایش_عکس" alt="پیش‌نمایش">
            
            <input type="text" id="لینک_دانلود" placeholder="لینک دانلود (اختیاری)">
            <button class="دکمه‌اصلی" onclick="ارسال_مطلب()">📤 ارسال</button>
            <p id="وضعیت_ارسال" class="وضعیت"></p>
            <button class="دکمه‌فرعی" style="margin-top:15px;" onclick="خروج_مدیریت()">خروج</button>
        </div>

        <!-- 📂 دسته‌بندی‌ها -->
        <div class="باکس">
            <h3>📂 فیلتر بر اساس دسته</h3>
            <div class="دسته‌ها">
                <span class="دسته فعال" onclick="انتخاب_دسته('همه')">همه</span>
                <span class="دسته" onclick="انتخاب_دسته('بازی')">بازی</span>
                <span class="دسته" onclick="انتخاب_دسته('نرم‌افزار')">نرم‌افزار</span>
                <span class="دسته" onclick="انتخاب_دسته('آموزش')">آموزش</span>
                <span class="دسته" onclick="انتخاب_دسته('متفرقه')">متفرقه</span>
            </div>
        </div>

        <!-- 📋 لیست مطالب -->
        <div class="باکس">
            <h3>📋 مطالب و فایل‌ها</h3>
            <div id="لیست_مطالب">
                <p class="خالی">در حال بارگذاری...</p>
            </div>
        </div>
    </div>

<script>
// ⚙ تنظیمات — از jsonbin.io بگیر
const API_KEY = "اینجا-کلید-API-رو-بذار";
const BIN_ID = "اینجا-BIN_ID-رو-بذار";
const رمز_مدیریت = "VP26-9K7X-QR4M-2P8Z-L5DN-3F9G-7H2J-6K4L"; // رمز ۳۲ رقمی

let دسترسی_مدیریت = false;
let دسته_فعال = "همه";
let مطالب = [];

// 🔐 بررسی رمز
function بررسی_رمز() {
    const ورودی = document.getElementById("رمز_مدیریت").value;
    const وضعیت = document.getElementById("وضعیت_ورود");
    
    if (ورودی === رمز_مدیریت) {
        دسترسی_مدیریت = true;
        وضعیت.className = "وضعیت موفق";
        وضعیت.textContent = "✅ وارد شدی — میتونی مطلب بفرستی";
        document.getElementById("بخش_ارسال").classList.remove("پنهان");
        document.getElementById("بخش_ورود").classList.add("پنهان");
    } else {
        وضعیت.className = "وضعیت خطا";
        وضعیت.textContent = "❌ رمز نادرست";
    }
}

function خروج_مدیریت() {
    دسترسی_مدیریت = false;
    document.getElementById("بخش_ارسال").classList.add("پنهان");
    document.getElementById("بخش_ورود").classList.remove("پنهان");
    document.getElementById("وضعیت_ورود").textContent = "";
    document.getElementById("رمز_مدیریت").value = "";
}

// 📸 پیش‌نمایش عکس
function پیش_نمایش_عکس(ورودی) {
    const فایل = ورودی.files[0];
    if (!فایل) return;
    
    const خواننده = new FileReader();
    خواننده.onload = function(e) {
        const تصویر = document.getElementById("پیش_نمایش");
        تصویر.src = e.target.result;
        تصویر.style.display = "block";
    };
    خواننده.readAsDataURL(فایل);
}

// 📤 ارسال مطلب
async function ارسال_مطلب() {
    if (!دسترسی_مدیریت) return;
    
    const دسته = document.getElementById("انتخاب_دسته").value;
    const متن = document.getElementById("متن_پیام").value.trim();
    const لینک = document.getElementById("لینک_دانلود").value.trim();
    const عکس_المان = document.getElementById("پیش_نمایش");
    const وضعیت = document.getElementById("وضعیت_ارسال");
    
    if (!متن) {
        وضعیت.className = "وضعیت خطا";
        وضعیت.textContent = "❌ متن خالی است!";
        return;
    }

    const عکس_داده = عکس_المان.style.display === "block" ? عکس_المان.src : null;

    وضعیت.className = "وضعیت";
    وضعیت.textContent = "در حال ارسال...";

    try {
        // دریافت مطالب قبلی
        const پاسخ = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: { "X-Master-Key": API_KEY }
        });
        const داده = await پاسخ.json();
        مطالب = داده.record?.مطالب || [];

        // اضافه کردن جدید
        مطالب.unshift({
            دسته, متن, لینک,
            عکس: عکس_داده,
            زمان: Date.now()
        });

        // ذخیره
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "X-Master-Key": API_KEY
            },
            body: JSON.stringify({ مطالب })
        });

        // پاک کردن فرم
        document.getElementById("متن_پیام").value = "";
        document.getElementById("لینک_دانلود").value = "";
        document.getElementById("عکس_ورودی").value = "";
        document.getElementById("پیش_نمایش").style.display = "none";

        وضعیت.className = "وضعیت موفق";
        وضعیت.textContent = "✅ مطلب فرستاده شد! همه می‌بینند";
        بارگذاری_مطالب();
        setTimeout(() => وضعیت.textContent = "", 3000);
    } catch (خطا) {
        وضعیت.className = "وضعیت خطا";
        وضعیت.textContent = "❌ خطا در ارسال";
        console.error(خطا);
    }
}

// 📂 انتخاب دسته
function انتخاب_دسته(نام) {
    دسته_فعال = نام;
    document.querySelectorAll(".دسته").forEach(d => d.classList.remove("فعال"));
    event.target.classList.add("فعال");
    نمایش_مطالب();
}

// 📥 بارگذاری مطالب
async function بارگذاری_مطالب() {
    try {
        const پاسخ = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: { "X-Master-Key": API_KEY }
        });
        const داده = await پاسخ.json();
        مطالب = داده.record?.مطالب || [];
        نمایش_مطالب();
    } catch (خطا) {
        document.getElementById("لیست_مطالب").innerHTML = 
            `<p class="خالی">❌ خطا در اتصال</p>`;
    }
}

// 📋 نمایش مطالب
function نمایش_مطالب() {
    const لیست = document.getElementById("لیست_مطالب");
    const فیلتر = دسته_فعال === "همه" ? مطالب : مطالب.filter(m => m.دسته === دسته_فعال);
    
    if (!فیلتر.length) {
        لیست.innerHTML = '<p class="خالی">هنوز مطلبی وجود ندارد</p>';
        return;
    }

    لیست.innerHTML = فیلتر.map(m => `
        <div class="آیتم">
            <span class="آیتم_دسته">${m.دسته}</span>
            <div style="margin-top:8px; line-height:1.7;">${m.متن.replace(/</g,"&lt;")}</div>
            ${m.عکس ? `<img src="${m.عکس}" class="آیتم_عکس" alt="عکس">` : ""}
            ${m.لینک ? `<a href="${m.لینک}" target="_blank" style="color:#00f0ff; display:inline-block; margin-top:10px;">🔗 دانلود / مشاهده</a>` : ""}
            <div class="آیتم_زمان">🕐 ${new Date(m.زمان).toLocaleString("fa-IR")}</div>
        </div>
    `).join("");
}

// 🔄 هر ۱۵ ثانیه بروزرسانی
بارگذاری_مطالب();
setInterval(بارگذاری_مطالب, 15000);
</script>
</body>
</html>
